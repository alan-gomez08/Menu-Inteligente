<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets-t1/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Menú digital gastronómico interactivo con pedidos directos por WhatsApp, delivery y takeaway." />

    <!-- Open Graph / Redes Sociales y Compartir -->
    <meta property="og:title" content="Menú Inteligente | Carta Digital Gastronómica" />
    <meta property="og:description" content="Carta digital interactiva con pedidos por WhatsApp, delivery y takeaway." />
    <meta property="og:image" content="/icons/icon-512x512.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />

    <!-- PWA Web App Manifest & Configuración Mobile -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#D9532F" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS Safari PWA / Add to Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Menú" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />

    <!-- Windows Tiles -->
    <meta name="msapplication-TileColor" content="#D9532F" />
    <meta name="msapplication-TileImage" content="/icons/icon-192x192.png" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Google Fonts: Precarga asíncrona sin bloqueo de renderizado y con display=optional para cero CLS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=optional"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=optional"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=optional"
      />
    </noscript>

    <title>Menú Inteligente | Carta Digital Gastronómica</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
